    <title>Obrigada pela Compra! | Método Brownie de Ouro™</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Assets/icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configuração do Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#FFF0F5',
                            pink: '#FFC0CB',
                            dark: '#DB2777',
                            accent: '#F472B6',
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Montserrat', sans-serif; }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .pulse-slow {
            animation: pulse-slow 2s ease-in-out infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-brand-light min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TZJ8GVLB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Confetti Elements -->
    <div id="confetti-container"></div>

    <!-- Main Content -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 max-w-lg w-full text-center relative z-10 border-4 border-pink-100">

        <!-- Success Icon -->
        <div class="w-20 h-20 md:w-24 md:h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 pulse-slow">
            <i class="fas fa-check text-green-500 text-4xl md:text-5xl"></i>
        </div>

        <!-- Title -->
        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-4">
            Obrigada pela Compra!
        </h1>

        <!-- Subtitle -->
        <p class="text-gray-600 text-base md:text-lg mb-6 leading-relaxed">
            Seu acesso ao <span class="text-brand-dark font-bold">Método Brownie de Ouro™</span> foi confirmado!
            Em instantes você receberá um e-mail com todas as instruções.
        </p>

        <!-- Divider -->
        <div class="w-16 h-1 bg-brand-dark rounded-full mx-auto mb-6"></div>

        <!-- Instagram CTA -->
        <p class="text-gray-500 text-sm mb-4">
            Enquanto isso, me siga no Instagram para mais dicas:
        </p>

        <a href="https://www.instagram.com/beca_brownies/" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center justify-center gap-3 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-400 hover:from-purple-600 hover:via-pink-600 hover:to-orange-500 text-white font-bold py-4 px-8 rounded-full text-base md:text-lg shadow-lg transition duration-300 w-full md:w-auto">
            <i class="fab fa-instagram text-xl"></i>
            Seguir @beca_brownies
        </a>

        <!-- Footer Note -->
        <p class="text-gray-400 text-xs mt-8">
            <i class="fas fa-envelope mr-1"></i> Confira também sua caixa de spam
        </p>

    </div>

    <!-- Background Decoration -->
    <div class="absolute top-10 left-10 w-32 h-32 bg-brand-dark/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-10 right-10 w-40 h-40 bg-pink-300/10 rounded-full blur-3xl"></div>

    <!-- Confetti Script -->
    <script>
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#DB2777', '#F472B6', '#FFC0CB', '#10B981', '#FBBF24'];

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(confetti);
            }

            // Remove confetti after animation
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Run confetti on page load
        window.onload = createConfetti;
    </script>
</body>
</html>
